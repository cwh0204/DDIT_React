<!DOCTYPE html>

<script>
  // 가짜 데이터 쓰기

  let dummy = []; // 빈 배열
  Array.from({ length: 108 }).forEach((_, idx) => {
    const gul = {
      gid: idx + 1,

      cont: "내용" + idx,
      writer: "지원" + idx,

  localStorage.setItem("sumin", JSON.stringify(dummy));
</script>
