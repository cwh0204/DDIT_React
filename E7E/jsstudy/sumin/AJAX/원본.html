<!DOCTYPE html>
<meta charset="UTF-8" />
<body>
  <button onclick="fAjax()">누르숑</button>
  <div id="disp" style="border: 2px solid black; min-height: 100px"></div>
</body>
<script>
  const disp = document.querySelector("#disp");

  function fAjax() {
    $.ajax({
      method: "get",
      url: "data.html",
      async: true,
      dataType: "json", //1이걸 설명하는데 server라는 말이 들어가면 안됨 서버가 아닌 스크립트에서 판단해서 처리한다
      success: function (rslt) {
        console.log("느끼미 오나용?", rslt);
        disp.innerHTML += rslt;
      },
    });
    /*
    fCommonAjax("get", "./data.csv", function (rslt) {
      console.log("받아온 결과는", rslt);
    });
    */
  }

  // 매개변수 처리를 덩어리 1개로 처리 {}
  const $ = {}; // 네임스페이스용
  $.ajax = function (pSet) {
    // jQuery Ajax의 탄생!
    const xhr = new XMLHttpRequest(); // 함수 안에서 사용, 전역으로 쓰지 않음
    xhr.open(pSet.method, pSet.url, pSet.async);
    xhr.onreadystatechange = function () {
      if (xhr.readyState == 4 && xhr.status == 200) {
        // 결과에 따른 처리 방식이 당연히 다른 경우가 많을 것임
        if (pSet.dataType == "json") {
          pSet.success(JSON.parse(xhr.responseText));
        } else {
          pSet.success(xhr.responseText);
        }

        pSet.success(xhr.responseText);
      }
    };
    xhr.send();
  };

  // 개발자라면 DRY 원칙이 머리에 떠오르고, 반복되는 코드를 심플하게 함
