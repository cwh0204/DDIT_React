<!DOCTYPE html>
<meta charset="UTF-8" />
<div id="jiwon">메롱</div>
<script>
  //navigator => 브라우져
  //window => 브라우저 탭 1개
  //document => html문서 자체 DOM
  const jw = document.querySelector("#jiwon");
  //jw.style.backgroundColor = "black";
  //jw.style.color = "yellow";
  //jw.style["backgroundColor"] = "black";
  //jw.style["color"] = "pink";
  css = (attr, val) => {
    jw.style[attr] = val;
    //배열식 접근법을 모르면 수많은 if문이나 switch 문이 필요하게 됨!
  };
  css("color", "blue");
  css("font-size", "5em");
  css("backgroundColor", "pink");
</script>
